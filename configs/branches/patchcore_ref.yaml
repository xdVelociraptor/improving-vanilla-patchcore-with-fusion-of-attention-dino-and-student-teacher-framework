# Protected PatchCore branch. Matches amazon-science/patchcore-inspection sample_training.sh
# "IM224 Baseline: WR50, layer2+3, coreset 10%, 1024>1024, patchsize 3, 1 NN, seed 0".
# MVTec AD uses the published 256 -> centre-crop 224 preprocessing.
# MVTec LOCO uses an ADAPTATION: whole scene letterboxed to 256x256 (no crop), padding excluded.
branch: patchcore
variant: patchcore_ref
backbone: wide_resnet50_2
layers: [layer2, layer3]
pretrain_embed_dimension: 1024
target_embed_dimension: 1024
patchsize: 3
patchstride: 1
anomaly_scorer_num_nn: 1
coreset_percentage: 0.1
coreset_starting_points: 10
coreset_project_dim: 128
coreset_seed: 0
knn_backend: faiss          # preferred (reference); falls back only if configured to `torch`
min_valid_fraction: 0.5
reweight_b: 9               # only for the separately named paper-reweighting score
batch_size: 8
cache: true
primary_score: max
transform:
  mvtec_ad: {kind: resize_crop, size: 256, crop: 224, normalize: imagenet}
  mvtec_loco: {kind: letterbox, size: 256, normalize: imagenet}
