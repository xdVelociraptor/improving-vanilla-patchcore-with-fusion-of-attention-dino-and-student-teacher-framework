[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridad"
version = "0.1.0"
description = "Protected PatchCore + local student-teacher + DINOv2 reconstruction + composition evidence for MVTec AD / MVTec LOCO AD"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.7",
  "torchvision>=0.22",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "pillow>=10",
  "pyyaml>=6",
  "pandas>=2",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "tifffile>=2023.1",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8"]
test = ["pytest>=8"]

[project.scripts]
hybridad = "hybridad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "weights: needs downloaded pretrained weights",
  "data: needs the real MVTec datasets",
  "reference: compares against the vendored author implementation",
  "slow: end-to-end synthetic pipeline",
]
