<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kutty Dinosaur architecture</title>
<style>
:root{color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
  --border:rgba(11,11,11,.10);--hover:rgba(11,11,11,.05);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--neg:#e34948;
  --q0:#cde2fb;--q1:#9ec5f4;--q2:#6da7ec;--q3:#3987e5;--q4:#256abf;--q5:#184f95;--q6:#0d366b;
  --accent:#2a78d6;--accent-wash:rgba(42,120,214,.10);--frozen-fill:#f0efec}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;
  --border:rgba(255,255,255,.10);--hover:rgba(255,255,255,.06);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--neg:#e66767;
  --q0:#0d366b;--q1:#184f95;--q2:#256abf;--q3:#3987e5;--q4:#6da7ec;--q5:#9ec5f4;--q6:#cde2fb;
  --accent:#3987e5;--accent-wash:rgba(57,135,229,.16);--frozen-fill:#262624}}
:root[data-theme="dark"]{color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;
  --border:rgba(255,255,255,.10);--hover:rgba(255,255,255,.06);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--neg:#e66767;
  --q0:#0d366b;--q1:#184f95;--q2:#256abf;--q3:#3987e5;--q4:#6da7ec;--q5:#9ec5f4;--q6:#cde2fb;
  --accent:#3987e5;--accent-wash:rgba(57,135,229,.16);--frozen-fill:#262624}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.page{max-width:1320px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font-size:24px;margin:0 0 4px;font-weight:650}
h2{font-size:17px;margin:28px 0 10px;font-weight:650}
h3{font-size:14.5px;margin:18px 0 8px;font-weight:650}
.sub{margin:0;color:var(--ink2);max-width:880px}
.foot{color:var(--muted);font-size:12.5px;margin-top:32px}
button{font:inherit;color:inherit}
.toggle{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:18px 0 6px;border-bottom:1px solid var(--grid)}
nav.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
section[role="tabpanel"]{display:none}section.active{display:block}
.filters{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin:16px 0 8px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);min-width:160px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent-wash);color:var(--ink);font-weight:600}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin:12px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:12px 0}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.tile .lab{font-size:12.5px;color:var(--ink2);hyphens:none}
.tile .lab .nb{white-space:nowrap}
.tile .val{font-size:32px;font-weight:650;margin:2px 0}
.tile .note{font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;letter-spacing:.04em;border:1px solid var(--ink2);color:var(--ink2);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
.note-box{border-left:3px solid var(--axis);padding:6px 12px;color:var(--ink2);margin:10px 0;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{color:var(--ink2);font-weight:600;cursor:default;user-select:none}
th.sort{cursor:pointer}th.sort:hover{color:var(--ink)}
td{font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--hover)}
.scroll{overflow-x:auto}
.bar{display:inline-block;height:8px;border-radius:0 4px 4px 0;background:var(--s1);vertical-align:middle;margin-right:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:4px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.key-line{display:inline-block;width:16px;height:2px;border-radius:2px}
.key-dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-size:11.5px;fill:var(--ink2);font-family:inherit}
.chart .axis line,.chart .axis path{stroke:var(--axis)}
.chart .grid line{stroke:var(--grid)}
.tip{position:fixed;pointer-events:none;z-index:10;background:var(--surface);color:var(--ink);border:1px solid var(--border);
  border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.14);display:none;max-width:320px}
.tip .t{color:var(--ink2);margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip .r b{font-variant-numeric:tabular-nums}
.tip .k{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.small{font-size:12.5px;color:var(--ink2)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.two,.three{grid-template-columns:1fr}}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:12.5px}
.arch-fig{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px 14px;margin:14px 0}
.arch-fig h3{margin:4px 0 8px}
.arch-fig figcaption{color:var(--ink2);font-size:13px;margin-top:8px;max-width:980px}
.steps li{margin:4px 0}

svg.arch{width:100%;height:auto;display:block;color:var(--ink)}
svg.arch .b-frozen{fill:var(--frozen-fill);stroke:var(--muted);stroke-width:1.2}
svg.arch .b-learned{fill:var(--accent-wash);stroke:var(--accent);stroke-width:1.4}
svg.arch .b-plain{fill:var(--surface);stroke:var(--axis);stroke-width:1.2}
svg.arch .b-out{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
svg.arch text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
svg.arch .t-title{font-size:12.5px;font-weight:600}
svg.arch .t-body{font-size:11.5px;fill:var(--ink2)}
svg.arch .t-head{font-size:12px;font-weight:600;fill:var(--ink2);letter-spacing:.02em}
svg.arch .t-arrow,svg.arch .t-legend{font-size:11.5px;fill:var(--ink2)}
svg.arch .ln{stroke:var(--ink2);stroke-width:1.4}
svg.arch .mk{fill:var(--ink2)}

</style>
</head>
<body><main class="page arch-page"><header class="top"><div><h1>Kutty Dinosaur architecture</h1><p class="sub">How an image becomes an anomaly score: four independent branches, per-branch normalization and fusion. Read each diagram left to right.</p></div></header><figure class="arch-fig"><h3>Figure 1. Architecture of the full model (G_full)</h3><svg viewBox="0 0 1292 520" role="img" class="arch" aria-label="Architecture: a test image is routed to four branches (PatchCore, local student-teacher, DINO reconstruction, composition); each preprocesses the image, applies a frozen pretrained backbone and a component fitted on normal images of the category, produces anomaly evidence and an image score; scores are normalized with held-out normal images and fused by maximum into one anomaly score, evaluated by image AUROC."><defs><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs><text x="242.0" y="44" class="t-head" text-anchor="middle">1  Preprocess</text><text x="425.0" y="44" class="t-head" text-anchor="middle">2  Frozen backbone</text><text x="621.0" y="44" class="t-head" text-anchor="middle">3  Fitted on normals</text><text x="812.0" y="44" class="t-head" text-anchor="middle">4  Anomaly evidence</text><text x="956.0" y="44" class="t-head" text-anchor="middle">5  Image score</text><text x="1080.0" y="44" class="t-head" text-anchor="middle">6  Normalize</text><text x="1224.0" y="44" class="t-head" text-anchor="middle">7  Fuse</text><rect x="16" y="196" width="112" height="140" rx="6" class="b-plain"/><text text-anchor="middle"><tspan x="72" y="248" class="t-title">Test image</tspan><tspan x="72" y="262" class="t-body">category known:</tspan><tspan x="72" y="278" class="t-body">routes to that</tspan><tspan x="72" y="292" class="t-body">category's models</tspan></text><path d="M128,266 H144" class="ln" fill="none"/><path d="M144,111.0 V417.0" class="ln" fill="none"/><line x1="144" y1="111.0" x2="160" y2="111.0" class="ln" marker-end="url(#arrA)"/><rect x="160" y="70" width="164" height="82" rx="6" class="b-plain"/><text text-anchor="middle"><tspan x="242" y="100" class="t-title">PatchCore</tspan><tspan x="242" y="115" class="t-body">AD: 256, crop 224</tspan><tspan x="242" y="130" class="t-body">LOCO: 256 letterbox</tspan></text><line x1="324" y1="111.0" x2="340" y2="111.0" class="ln" marker-end="url(#arrA)"/><rect x="340" y="70" width="170" height="82" rx="6" class="b-frozen"/><text text-anchor="middle"><tspan x="425" y="100" class="t-title">WideResNet-50-2</tspan><tspan x="425" y="115" class="t-body">layers 2+3, 3×3 patches</tspan><tspan x="425" y="130" class="t-body">→ 1024-d per patch</tspan></text><line x1="510" y1="111.0" x2="526" y2="111.0" class="ln" marker-end="url(#arrA)"/><rect x="526" y="70" width="190" height="82" rx="6" class="b-learned"/><text text-anchor="middle"><tspan x="621" y="100" class="t-title">Coreset memory</tspan><tspan x="621" y="115" class="t-body">10% of normal patches</tspan><tspan x="621" y="130" class="t-body">(no gradient training)</tspan></text><line x1="716" y1="111.0" x2="732" y2="111.0" class="ln" marker-end="url(#arrA)"/><rect x="732" y="70" width="160" height="82" rx="6" class="b-plain"/><text text-anchor="middle"><tspan x="812" y="100" class="t-body">nearest-neighbour</tspan><tspan x="812" y="115" class="t-body">distance per patch</tspan><tspan x="812" y="130" class="t-body">→ anomaly map</tspan></text><line x1="892" y1="111.0" x2="908" y2="111.0" class="ln" marker-end="url(#arrA)"/><rect x="908" y="70" width="96" height="82" rx="6" class="b-plain"/><text text-anchor="middle"><tspan x="956" y="108" class="t-body">max over</tspan><tspan x="956" y="122" class="t-body">patches</tspan></text><line x1="1004" y1="111.0" x2="1020" y2="111.0" class="ln" marker-end="url(#arrA)"/><rect x="1020" y="70" width="120" height="82" rx="6" class="b-learned"/><text text-anchor="middle"><tspan x="1080" y="100" class="t-title">z = (s − m)</tspan><tspan x="1080" y="115" class="t-title">÷ (Q95 − m)</tspan><tspan x="1080" y="130" class="t-body">held-out normals</tspan></text><line x1="144" y1="213.0" x2="160" y2="213.0" class="ln" marker-end="url(#arrA)"/><rect x="160" y="172" width="164" height="82" rx="6" class="b-plain"/><text text-anchor="middle"><tspan x="242" y="202" class="t-title">Local student–teacher</tspan><tspan x="242" y="217" class="t-body">AD: 256 × 256</tspan><tspan x="242" y="232" class="t-body">LOCO: 256 letterbox</tspan></text><line x1="324" y1="213.0" x2="340" y2="213.0" class="ln" marker-end="url(#arrA)"/><rect x="340" y="172" width="170" height="82" rx="6" class="b-frozen"/><text text-anchor="middle"><tspan x="425" y="202" class="t-title">PDN-S teacher</tspan><tspan x="425" y="217" class="t-body">33×33 receptive field</tspan><tspan x="425" y="232" class="t-body">channel-normalized</tspan></text><line x1="510" y1="213.0" x2="526" y2="213.0" class="ln" marker-end="url(#arrA)"/><rect x="526" y="172" width="190" height="82" rx="6" class="b-learned"/><text text-anchor="middle"><tspan x="621" y="202" class="t-title">PDN-S student</tspan><tspan x="621" y="217" class="t-body">trained to imitate the</tspan><tspan x="621" y="232" class="t-body">teacher (70k steps)</tspan></text><line x1="716" y1="213.0" x2="732" y2="213.0" class="ln" marker-end="url(#arrA)"/><rect x="732" y="172" width="160" height="82" rx="6" class="b-plain"/><text text-anchor="middle"><tspan x="812" y="202" class="t-body">‖teacher − student‖²</tspan><tspan x="812" y="217" class="t-body">channel mean</tspan><tspan x="812" y="232" class="t-body">→ anomaly map</tspan></text><line x1="892" y1="213.0" x2="908" y2="213.0" class="ln" marker-end="url(#arrA)"/><rect x="908" y="172" width="96" height="82" rx="6" class="b-plain"/><text text-anchor="middle"><tspan x="956" y="210" class="t-body">max over</tspan><tspan x="956" y="224" class="t-body">pixels</tspan></text><line x1="1004" y1="213.0" x2="1020" y2="213.0" class="ln" marker-end="url(#arrA)"/><rect x="1020" y="172" width="120" height="82" rx="6" class="b-learned"/><text text-anchor="middle"><tspan x="1080" y="202" class="t-title">z = (s − m)</tspan><tspan x="1080" y="217" class="t-title">÷ (Q95 − m)</tspan><tspan x="1080" y="232" class="t-body">held-out normals</tspan></text><line x1="144" y1="315.0" x2="160" y2="315.0" class="ln" marker-end="url(#arrA)"/><rect x="160" y="274" width="164" height="82" rx="6" class="b-plain"/><text text-anchor="middle"><tspan x="242" y="304" class="t-title">DINO reconstruction</tspan><tspan x="242" y="319" class="t-body">AD: 448 × 448</tspan><tspan x="242" y="334" class="t-body">LOCO: 448 letterbox</tspan></text><line x1="324" y1="315.0" x2="340" y2="315.0" class="ln" marker-end="url(#arrA)"/><rect x="340" y="274" width="170" height="82" rx="6" class="b-frozen"/><text text-anchor="middle"><tspan x="425" y="304" class="t-title">DINOv2 ViT-B/14 + reg.</tspan><tspan x="425" y="319" class="t-body">layers 2–9</tspan><tspan x="425" y="334" class="t-body">32×32 tokens</tspan></text><line x1="510" y1="315.0" x2="526" y2="315.0" class="ln" marker-end="url(#arrA)"/><rect x="526" y="274" width="190" height="82" rx="6" class="b-learned"/><text text-anchor="middle"><tspan x="621" y="304" class="t-title">bottleneck + 8-block</tspan><tspan x="621" y="319" class="t-body">linear-attention decoder</tspan><tspan x="621" y="334" class="t-body">(5k iterations)</tspan></text><line x1="716" y1="315.0" x2="732" y2="315.0" class="ln" marker-end="url(#arrA)"/><rect x="732" y="274" width="160" height="82" rx="6" class="b-plain"/><text text-anchor="middle"><tspan x="812" y="304" class="t-body">1 − cosine(encoder,</tspan><tspan x="812" y="319" class="t-body">reconstruction)</tspan><tspan x="812" y="334" class="t-body">→ anomaly map</tspan></text><line x1="892" y1="315.0" x2="908" y2="315.0" class="ln" marker-end="url(#arrA)"/><rect x="908" y="274" width="96" height="82" rx="6" class="b-plain"/><text text-anchor="middle"><tspan x="956" y="312" class="t-body">mean of</tspan><tspan x="956" y="326" class="t-body">top 1%</tspan></text><line x1="1004" y1="315.0" x2="1020" y2="315.0" class="ln" marker-end="url(#arrA)"/><rect x="1020" y="274" width="120" height="82" rx="6" class="b-learned"/><text text-anchor="middle"><tspan x="1080" y="304" class="t-title">z = (s − m)</tspan><tspan x="1080" y="319" class="t-title">÷ (Q95 − m)</tspan><tspan x="1080" y="334" class="t-body">held-out normals</tspan></text><line x1="144" y1="417.0" x2="160" y2="417.0" class="ln" marker-end="url(#arrA)"/><rect x="160" y="376" width="164" height="82" rx="6" class="b-plain"/><text text-anchor="middle"><tspan x="242" y="406" class="t-title">Composition</tspan><tspan x="242" y="421" class="t-body">objects only</tspan><tspan x="242" y="436" class="t-body">448 / 448 letterbox</tspan></text><line x1="324" y1="417.0" x2="340" y2="417.0" class="ln" marker-end="url(#arrA)"/><rect x="340" y="376" width="170" height="82" rx="6" class="b-frozen"/><text text-anchor="middle"><tspan x="425" y="406" class="t-title">DINOv2 final-layer</tspan><tspan x="425" y="421" class="t-body">patch tokens</tspan><tspan x="425" y="436" class="t-body">→ PCA-64</tspan></text><line x1="510" y1="417.0" x2="526" y2="417.0" class="ln" marker-end="url(#arrA)"/><rect x="526" y="376" width="190" height="82" rx="6" class="b-learned"/><text text-anchor="middle"><tspan x="621" y="406" class="t-title">10 visual clusters;</tspan><tspan x="621" y="421" class="t-body">mass, appearance, layout,</tspan><tspan x="621" y="436" class="t-body">adjacency; normal memory</tspan></text><line x1="716" y1="417.0" x2="732" y2="417.0" class="ln" marker-end="url(#arrA)"/><rect x="732" y="376" width="160" height="82" rx="6" class="b-plain"/><text text-anchor="middle"><tspan x="812" y="406" class="t-body">distance to the 3</tspan><tspan x="812" y="421" class="t-body">nearest normal images</tspan><tspan x="812" y="436" class="t-body">(no map)</tspan></text><line x1="892" y1="417.0" x2="908" y2="417.0" class="ln" marker-end="url(#arrA)"/><rect x="908" y="376" width="96" height="82" rx="6" class="b-plain"/><text text-anchor="middle"><tspan x="956" y="414" class="t-body">joint</tspan><tspan x="956" y="428" class="t-body">kNN score</tspan></text><line x1="1004" y1="417.0" x2="1020" y2="417.0" class="ln" marker-end="url(#arrA)"/><rect x="1020" y="376" width="120" height="82" rx="6" class="b-learned"/><text text-anchor="middle"><tspan x="1080" y="406" class="t-title">z = (s − m)</tspan><tspan x="1080" y="421" class="t-title">÷ (Q95 − m)</tspan><tspan x="1080" y="436" class="t-body">held-out normals</tspan></text><path d="M1140,111.0 H1160" class="ln" fill="none"/><path d="M1140,213.0 H1160" class="ln" fill="none"/><path d="M1140,315.0 H1160" class="ln" fill="none"/><path d="M1140,417.0 H1160" class="ln" fill="none"/><path d="M1160,111.0 V417.0" class="ln" fill="none"/><line x1="1160" y1="241" x2="1172" y2="241" class="ln" marker-end="url(#arrA)"/><rect x="1172" y="196" width="104" height="90" rx="6" class="b-plain"/><text text-anchor="middle"><tspan x="1224" y="222" class="t-title">max</tspan><tspan x="1224" y="238" class="t-body">(G_full)</tspan><tspan x="1224" y="252" class="t-body">mean / OR:</tspan><tspan x="1224" y="268" class="t-body">ablations</tspan></text><line x1="1224.0" y1="286" x2="1224.0" y2="318" class="ln" marker-end="url(#arrA)"/><rect x="1172" y="318" width="104" height="60" rx="6" class="b-out"/><text text-anchor="middle"><tspan x="1224" y="344" class="t-title">anomaly</tspan><tspan x="1224" y="360" class="t-title">score</tspan></text><line x1="1224.0" y1="378" x2="1224.0" y2="410" class="ln" marker-end="url(#arrA)"/><rect x="1172" y="410" width="104" height="48" rx="6" class="b-out"/><text text-anchor="middle"><tspan x="1224" y="430" class="t-title">image AUROC</tspan><tspan x="1224" y="446" class="t-body">vs test labels</tspan></text><rect x="160" y="488" width="26" height="16" rx="4" class="b-frozen"/><text x="194" y="500" class="t-legend">pretrained, frozen (never updated)</text><rect x="464.8" y="488" width="26" height="16" rx="4" class="b-learned"/><text x="498.8" y="500" class="t-legend">fitted on normal images of the category</text><rect x="805.6" y="488" width="26" height="16" rx="4" class="b-plain"/><text x="839.6" y="500" class="t-legend">fixed computation</text><rect x="988.0" y="488" width="26" height="16" rx="4" class="b-out"/><text x="1022.0" y="500" class="t-legend">score / result</text></svg><figcaption>A test image of a known category passes through four independent branches. Each one preprocesses the image its own way, extracts features with a frozen pretrained network, compares them with what it learned from normal images of that category, and reduces the evidence to one image score. Each score is normalized with held-out normal images, and the maximum of the four is the anomaly score.</figcaption></figure>
<figure class="arch-fig"><h3>Figure 2. Which images are used where</h3><svg viewBox="0 0 1292 196" role="img" class="arch" aria-label="Data roles: normal training images are split into fit (trains every branch), calib_scale (fits score normalizers) and calib_threshold (OR-rule offsets only); test images are scored by the fixed models and labels are used only to compute AUROC."><defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs><rect x="16" y="30" width="200" height="120" rx="6" class="b-plain"/><text text-anchor="middle"><tspan x="116" y="72" class="t-title">Normal images</tspan><tspan x="116" y="86" class="t-body">MVTec AD: train/good</tspan><tspan x="116" y="102" class="t-body">MVTec LOCO: train/good +</tspan><tspan x="116" y="116" class="t-body">validation/good</tspan></text><path d="M216,90 C250,90 250,42 284,42" class="ln" fill="none" marker-end="url(#arrB)"/><rect x="284" y="20" width="150" height="44" rx="6" class="b-learned"/><text text-anchor="middle"><tspan x="359" y="46" class="t-title">fit</tspan></text><line x1="434" y1="42" x2="470" y2="42" class="ln" marker-end="url(#arrB)"/><rect x="470" y="20" width="230" height="44" rx="6" class="b-plain"/><text text-anchor="middle"><tspan x="585" y="38" class="t-body">train every branch: memories,</tspan><tspan x="585" y="54" class="t-body">student, decoder, clusters</tspan></text><path d="M216,90 C250,90 250,100 284,100" class="ln" fill="none" marker-end="url(#arrB)"/><rect x="284" y="78" width="150" height="44" rx="6" class="b-learned"/><text text-anchor="middle"><tspan x="359" y="104" class="t-title">calib_scale</tspan></text><line x1="434" y1="100" x2="470" y2="100" class="ln" marker-end="url(#arrB)"/><rect x="470" y="78" width="230" height="44" rx="6" class="b-plain"/><text text-anchor="middle"><tspan x="585" y="96" class="t-body">fit the score normalizers</tspan><tspan x="585" y="1
